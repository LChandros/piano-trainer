<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Piano Trainer — Phase 1</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>🎹 Piano Trainer</h1>
    <div class="controls">
      <button id="openLibrary" title="Song library">🎵 <span id="currentSongName">Songs</span> ▾</button>
      <select id="song" hidden></select>
      <input id="file" type="file" accept=".mid,.midi" style="display:none" />
      <label>Hands
        <select id="hand">
          <option value="both">Both</option>
          <option value="R">Right</option>
          <option value="L">Left</option>
        </select>
      </label>
      <label>Mode
        <select id="mode">
          <option value="wait">Notes (wait)</option>
          <option value="score">Rhythm (score)</option>
        </select>
      </label>
      <label>Tempo
        <input id="tempo" type="range" min="0.4" max="1.2" step="0.05" value="0.8" />
        <span id="tempoVal">80%</span>
      </label>
      <label><input type="checkbox" id="labels" /> Labels</label>
      <span class="tag" id="measure">m. 0 / 0</span>
      <button id="restart">Restart</button>
      <button id="start">Start</button>
      <button id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>

  <div id="progress"><div id="progressFill"></div><div id="ticks"></div></div>

  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="settings" class="panel" hidden>
      <h3>Appearance</h3>
      <label class="crow">White-key notes <input type="color" data-theme="whiteNote" /></label>
      <label class="crow">Black-key notes <input type="color" data-theme="blackNote" /></label>
      <label class="crow">Note at hit line <input type="color" data-theme="hitNote" /></label>
      <label class="crow">Label highlight <input type="color" data-theme="labelBg" /></label>
      <label class="crow">Label text <input type="color" data-theme="labelText" /></label>
      <button id="resetTheme">Reset to defaults</button>
      <h3 style="margin-top:14px">Hands</h3>
      <div id="handsBox"></div>
    </div>
  </div>

  <div id="library" class="library" hidden>
    <div class="lib-head">
      <h2>🎵 Song Library</h2>
      <input id="libSearch" type="search" placeholder="Search songs…" />
      <button id="libUpload">⬆ Upload MIDI</button>
      <button id="libClose">✕ Close</button>
    </div>
    <div id="libList" class="lib-list"></div>
  </div>

  <footer>
    <span id="midiStatus" class="midi-status">Live MIDI: checking…</span>
    <span class="hint">Play with the on-screen keys, live MIDI, or computer keys —
      bottom row <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd><kbd>V</kbd><kbd>B</kbd><kbd>N</kbd><kbd>M</kbd> = left-hand octave,
      top row <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd> = right-hand octave</span>
  </footer>

  <script src="js/songs.js"></script>
  <script src="js/midi-parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
